<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevents scrollbars */
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/"
          }
        }
    </script>
         
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { BVHLoader } from 'three/addons/loaders/BVHLoader.js';
        import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

        // Add near the top of your script
        let streamingMode = false;
        let frameBuffer = [];
        let lastFrameTime = 0;
        let websocket = null;
        let isConnected = false;

        let audioContext;
        let audioBufferQueue = [];
        let audioSchedulerRunning = false;
        let nextAudioPlayTime = 0;
        let audioFrameDuration = 1/30; // For 30fps

        // Add this function to initialize audio context
        function initAudioContext() {
            // Create audio context (with user interaction to satisfy autoplay policies)
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            nextAudioPlayTime = audioContext.currentTime;
            console.log("Audio context initialized");
        }

        // Add this in your bvh_viewer.html JavaScript code
        function getWebSocketPort() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('wsport') || 8765; // Default fallback port
        }

        // Add this function to establish WebSocket connection
        function connectWebSocket() {
            websocket = new WebSocket(`ws://localhost:${getWebSocketPort()}`);
            console.log(`Connecting to WebSocket on port ${getWebSocketPort()}`);      
            websocket.onopen = () => {
                statusIndicator.style.backgroundColor = 'green';
                isConnected = true;
            };
            
            websocket.onmessage = (event) => {
                try {
                    const frameData = JSON.parse(event.data);
                    console.log(`Received frame with ${Object.keys(frameData.joints || {}).length} joints`);
                    
                    // Process audio if present
                    if (frameData.audio_chunk) {
                        processAudioChunk(frameData.audio_chunk);
                    }
                    
                    frameBuffer.push(frameData);
                    // Limit buffer size to prevent memory issues
                    if (frameBuffer.length > 60) { // 2 seconds at 30fps
                        frameBuffer.shift();
                    }
                } catch (error) {
                    console.error('Error processing WebSocket message:', error);
                }
            };
            
            websocket.onclose = () => {
                console.log('WebSocket connection closed');
                statusIndicator.style.backgroundColor = 'red';
                isConnected = false;
            };
            
            websocket.onerror = (error) => {
                console.error('WebSocket error:', error);
                statusIndicator.style.backgroundColor = 'red';
            };
        }

        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);
        camera.position.set(2, 1, 0); // Adjusted position for better viewing

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(2, 2, 2);
        scene.add(light);

        const ambientLight = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambientLight);

        // Orbit Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Smooth movement
        controls.dampingFactor = 0.1;
        controls.minDistance = 1;
        controls.maxDistance = 10;
        controls.enablePan = false; // Disable moving the camera
        controls.target.set(0, 1.0, 0); // Set the target to the model's height

        let glbModel, bvhSkeleton, animationMixer, bvhData, bvhClip, animAction;

        // Load both GLB and BVH in parallel
        const glbLoad = new Promise((resolve, reject) => {
            const gltfLoader = new GLTFLoader();
            gltfLoader.load('model.glb', (gltf) => {
                glbModel = gltf.scene;
                scene.add(glbModel);
                resolve();
            }, undefined, reject); // On error, reject the promise
        });

        const bvhLoad = new Promise((resolve, reject) => {
            const bvhLoader = new BVHLoader();
            bvhLoader.load('motion.bvh', (bvh) => {
                bvhData = bvh;
                bvhSkeleton = bvh.skeleton;
                bvhClip = bvh.clip;
                resolve();
            }, undefined, reject); // On error, reject the promise
        });

        // Wait for both files to finish loading
        await Promise.all([glbLoad, bvhLoad]);
        console.log('Both models loaded successfully');

        
        // scale the skeleton to 1 % of the original size
        bvhData.skeleton.bones[0].scale.set(0.01, 0.01, 0.01);

        // scale the model to be half the size of the original
        //glbModel.scale.set(0.5, 0.5, 0.5);

        // Scale down the root motion
        bvhClip.tracks.forEach((track) => {
            if (track.name === 'body_world.position') {
                console.log('Scaling down root motion');
                for (let i = 0; i < track.values.length; i++) {
                    track.values[i] *= 0.005;
                }
            }
        });

        const skeletonHelper = new THREE.SkeletonHelper(
            bvhData.skeleton.bones[0],
        );
        skeletonHelper.skeleton = bvhData.skeleton;

        var boneContainer = new THREE.Group();
        boneContainer.add(bvhData.skeleton.bones[0]);

        scene.add(skeletonHelper);
        scene.add(boneContainer);

        // At this point the skeletons should be aligned. I will now retarget using .attach for each bone 
        // (stupid but I can't get anything else to work)

        console.log('Attaching BVH bones to GLB bones');

        // First, create a map of all bones in the GLB model
        const glbBonesMap = {};
        glbModel.traverse((object) => {
            if (object.isBone || object.type === 'Bone') {
                glbBonesMap[object.name] = object;
            }
        });

        console.log(`Found ${Object.keys(glbBonesMap).length} bones in GLB model`);
        console.log('Available GLB bones:', Object.keys(glbBonesMap));

        // Now connect BVH bones to GLB bones
        let matchedCount = 0;
        for (let i = 0; i < bvhData.skeleton.bones.length; i++) {
            const bvhBone = bvhData.skeleton.bones[i];
            const glbBone = glbBonesMap[bvhBone.name];
            
            console.log(`BVH bone: ${bvhBone.name} -> GLB bone: ${glbBone ? glbBone.name : 'null'}`);
            
            if (glbBone) {
                matchedCount++;
                if (bvhBone.name !== 'ENDSITE') {
                    bvhBone.attach(glbBone);
                }
            } else {
                console.warn(`No matching GLB bone found for ${bvhBone.name}`);
            }
        }

        console.log(`Successfully matched ${matchedCount} out of ${bvhData.skeleton.bones.length} bones`);

        // Create a map of original bvh bone positions
        const originalBonePositions = {};
        bvhData.skeleton.bones.forEach((bone) => {
            originalBonePositions[bone.name] = bone.position.clone();
        });

        animationMixer = new THREE.AnimationMixer(glbModel);

        console.log(glbModel);
        console.log(skeletonHelper);

        //animAction = animationMixer.clipAction(bvhClip);
        //animAction.reset();
        //animAction.setLoop(THREE.LoopRepeat);

        //animAction.enabled = true;
        //animAction.play();

        // create an anim mixer for the BVH skeleton
        let bvhMixer = new THREE.AnimationMixer(bvhData.skeleton.bones[0]);
        let bvhAction = bvhMixer.clipAction(bvhClip);
        bvhAction.reset();
        bvhAction.setLoop(THREE.LoopRepeat);
        bvhAction.enabled = true;
        bvhAction.play();

        // Animation Loop
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const clockDelta = clock.getDelta();
            const currentTime = clock.getElapsedTime();
            
            if (streamingMode && frameBuffer.length > 0) {
                // Process streamed frames
                processStreamedFrames(currentTime);
            } else {
                // Normal animation playback
                if (bvhMixer && !bvhAction.paused) {
                    bvhMixer.update(clockDelta);
                }
            }

            // because of how bvh works and how it is retargeted all the positional offsets are double what they should be
            // here I restore the original bone positions (excluding hip)
            bvhData.skeleton.bones.forEach((bone) => {
                if (bone.name !== 'body_world' && bone.name !== 'ENDSITE') {
                    const originalPosition = originalBonePositions[bone.name];
                    if (originalPosition) {
                        bone.position.copy(originalPosition);
                    }
                }
            });
            
            renderer.render(scene, camera);
        }

        function processStreamedFrames(currentTime) {
            if (frameBuffer.length === 0) return;
            
            // Get the next frame if it's time to display it
            if (currentTime - lastFrameTime >= 1/30) { // Assuming 30fps stream
                lastFrameTime = currentTime;
                const frameData = frameBuffer.shift();
                applyFrameToSkeleton(frameData);
            }
        }

        function applyFrameToSkeleton(frameData) {
            // Check if we have valid joint data
            if (!frameData.joints) {
                console.warn('Frame data missing joints property:', frameData);
                return;
            }
            
            // Handle dictionary format with named bones
            Object.entries(frameData.joints).forEach(([boneName, jointData]) => {
                // Find the bone by name
                const bone = bvhData.skeleton.bones.find(b => b.name === boneName);
                
                if (bone) {
                    // Apply position (typically only for root bone)
                    if (jointData.position) {
                        bone.position.set(
                            jointData.position.x * 0.005, // Apply your scale factor
                            jointData.position.y * 0.005,
                            jointData.position.z * 0.005
                        );
                    }
                    
                    // Apply rotation to bone
                    if (jointData.eulerAngles) {
                        // Create Euler with explicit ZXY order
                        const euler = new THREE.Euler(
                            jointData.eulerAngles.x * Math.PI/180, // Convert degrees to radians
                            jointData.eulerAngles.y * Math.PI/180,
                            jointData.eulerAngles.z * Math.PI/180,
                            'ZXY' // Important: specify the correct order
                        );
                        
                        // Apply the euler rotation
                        bone.setRotationFromEuler(euler);
                    }
                } else {
                    console.warn(`Bone ${boneName} not found in skeleton`);
                }
            });
        }

        function processAudioChunk(audioBase64) {
            if (!audioContext) {
                console.warn("Audio context not initialized");
                return;
            }
            
            try {
                // Decode base64 audio data (WAV format)
                const binaryString = atob(audioBase64);
                const byteArray = new Uint8Array(binaryString.length);
                
                for (let i = 0; i < binaryString.length; i++) {
                    byteArray[i] = binaryString.charCodeAt(i);
                }
                
                console.log("Audio data size:", byteArray.length, "bytes");
                
                // Convert to AudioBuffer - now using proper WAV format with headers
                audioContext.decodeAudioData(byteArray.buffer)
                    .then(audioBuffer => {
                        console.log("Successfully decoded audio buffer:", 
                                    "duration:", audioBuffer.duration, 
                                    "channels:", audioBuffer.numberOfChannels,
                                    "sample rate:", audioBuffer.sampleRate);
                        
                        // Add to our queue
                        audioBufferQueue.push(audioBuffer);
                        
                        // Start audio scheduler if not already running
                        if (!audioSchedulerRunning) {
                            audioSchedulerRunning = true;
                            scheduleAudioPlayback();
                        }
                    })
                    .catch(err => {
                        console.error("Error decoding audio data:", err);
                    });
            } catch (error) {
                console.error("Error processing audio chunk:", error);
            }
        }

        // Add this function to schedule audio playback
        function scheduleAudioPlayback() {
            // Process all available buffers that need to be played
            while (audioBufferQueue.length > 0) {
                const audioBuffer = audioBufferQueue.shift();
                
                // Create audio source
                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioContext.destination);
                
                // Schedule the audio to play
                const currentTime = audioContext.currentTime;
                
                // If we're behind real-time, catch up
                if (nextAudioPlayTime < currentTime) {
                    nextAudioPlayTime = currentTime;
                }
                
                // Play the audio at the scheduled time
                source.start(nextAudioPlayTime);
                
                // Calculate next play time
                nextAudioPlayTime += audioBuffer.duration;
            }
            
            // Check again in a short while for new audio chunks
            if (streamingMode) {
                setTimeout(() => {
                    scheduleAudioPlayback();
                }, 10);
            } else {
                audioSchedulerRunning = false;
            }
        }

        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // UI Controls
        const controlsContainer = document.createElement('div');
        controlsContainer.style.position = 'absolute';
        controlsContainer.style.bottom = '10px';
        controlsContainer.style.left = '10px';
        controlsContainer.style.background = 'rgba(255, 255, 255, 0.8)';
        controlsContainer.style.padding = '10px';
        controlsContainer.style.borderRadius = '5px';
        document.body.appendChild(controlsContainer);

        // Play/Pause Button
        const playPauseButton = document.createElement('button');
        playPauseButton.innerText = 'Pause';
        playPauseButton.onclick = () => {
            if (animAction.paused) {
                animAction.play();
                bvhAction.play();
                playPauseButton.innerText = 'Pause';
            } else {
                animAction.paused = true;
                bvhAction.paused = true;
                playPauseButton.innerText = 'Play';
            }
        };
        controlsContainer.appendChild(playPauseButton);

        // Skeleton Toggle
        const skeletonToggle = document.createElement('button');
        skeletonToggle.innerText = 'Toggle Skeleton';
        skeletonToggle.onclick = () => {
            skeletonHelper.visible = !skeletonHelper.visible;
        };
        controlsContainer.appendChild(skeletonToggle);

        // Timeline Slider
        const timeline = document.createElement('input');
        timeline.type = 'range';
        timeline.min = 0;
        timeline.max = 1;
        timeline.step = 0.01;
        timeline.value = 0;
        timeline.style.width = '200px';
        timeline.oninput = () => {
            //if (animationMixer) {
            //    animAction.time = animAction.getClip().duration * timeline.value;
            //}
            if (bvhMixer) {
                bvhAction.time = bvhAction.getClip().duration * timeline.value;
            }
        };
        controlsContainer.appendChild(timeline);

        // Update Timeline While Playing
        setInterval(() => {
            //if (animationMixer && !animAction.paused) {
            //    timeline.value = animAction.time / animAction.getClip().duration;
            //}
            if (bvhMixer && !bvhAction.paused) {
                timeline.value = bvhAction.time / bvhAction.getClip().duration;
            }
        }, 100);

        // Add after your existing UI controls
        const streamingToggle = document.createElement('button');
        streamingToggle.innerText = 'Start Streaming';
        streamingToggle.onclick = () => {
            streamingMode = !streamingMode;
            
            if (streamingMode) {
                // Pause normal animation and start streaming
                if (animAction) animAction.paused = true;
                if (bvhAction) bvhAction.paused = true;
                playPauseButton.disabled = true;
                timeline.disabled = true;
                
                // Initialize audio context on first user interaction
                if (!audioContext) {
                    initAudioContext();
                } else if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                
                if (!isConnected) {
                    connectWebSocket();
                }
                
                streamingToggle.innerText = 'Stop Streaming';
            } else {
                // Resume normal mode
                playPauseButton.disabled = false;
                timeline.disabled = false;
                streamingToggle.innerText = 'Start Streaming';
            }
        };
        controlsContainer.appendChild(streamingToggle);

        // Connection status indicator
        const statusIndicator = document.createElement('div');
        statusIndicator.style.width = '10px';
        statusIndicator.style.height = '10px';
        statusIndicator.style.borderRadius = '50%';
        statusIndicator.style.backgroundColor = 'red';
        statusIndicator.style.display = 'inline-block';
        statusIndicator.style.marginLeft = '10px';
        controlsContainer.appendChild(statusIndicator);
    </script>
</body>
</html>
