<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevents scrollbars */
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgb(33, 33, 33), #080808);
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/"
          }
        }
    </script>
         
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CharacterManager } from './characters/CharacterManager.js';
        import { AnimationManager } from './animation/AnimationManager.js';
        import { DebugVisualizer } from './debug/DebugVisualizer.js';
        import { TensorVisualizer } from './debug/TensorVisualizer2.js';
        import { AudioManager } from './audio/AudioManager.js';
        import { MessageHandlerSystem } from './messageHandling/MessageHandlerSystem.js';

        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);
        camera.position.set(0, 1, 2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0); // Transparent background
        document.body.appendChild(renderer.domElement);

        // Lighting
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(2, 2, 2);
        scene.add(light);
        const light2 = new THREE.DirectionalLight(0xffffff, 0.1);
        light2.position.set(-2, 1, -1);
        scene.add(light2);

        const ambientLight = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambientLight);

        // Add grid to the floor
        const gridSize = 10;
        const gridDivisions = 10;
        const gridHelper = new THREE.GridHelper(gridSize, gridDivisions, 0x444444, 0x222222);
        scene.add(gridHelper);
        

        // Orbit Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.minDistance = 1;
        controls.maxDistance = 10;
        controls.enablePan = true;
        controls.target.set(0, 1.0, 0);

        // Create managers
        const messageHandler = new MessageHandlerSystem();
        const characterManager = new CharacterManager(scene);
        const animationManager = new AnimationManager();
        const debugVisualizer = new DebugVisualizer(scene);
        const tensorVisualizer = new TensorVisualizer();
        const audioManager = new AudioManager(scene);

        // Register handlers for different message types
        messageHandler.registerHandler('pose', (data) => characterManager.handlePoseMessage(data));
        messageHandler.registerHandler('character', (data) => characterManager.handleAddCharacterMessage(data));
        messageHandler.registerHandler('debug_positions', (data) => debugVisualizer.handlePositionsMessage(data));
        messageHandler.registerHandler('debug_tensor', (data) => tensorVisualizer.handleTensorMessage(data));
        messageHandler.registerHandler('audio', (data) => audioManager.handleAudioMessage(data));
        
        let streamingMode = true;
        let websocket = null;
        let isConnected = false;
        let statusIndicator = null;
        let reconnectTimeout = null;
        let reconnectAttempt = 0;
        let maxReconnectDelay = 5000; // Maximum delay between reconnection attempts (5 seconds)

        // Load characters and start animation
        async function init() {
            // Load character
            await characterManager.addCharacter('default');
            
            // Set up UI
            setupUI();

            // Connect WebSocket
            connectWebSocket();
            
            // Start animation loop
            animate();
        }

        // Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            // Update orbit controls
            controls.update();
            
            // Update characters
            characterManager.update(delta);
            
            renderer.render(scene, camera);
        }

        // WebSocket handling
        function connectWebSocket() {
            if (websocket && (websocket.readyState === WebSocket.CONNECTING || 
                             websocket.readyState === WebSocket.OPEN)) {
                return; // Already connecting or connected
            }
            
            clearTimeout(reconnectTimeout); // Clear any pending reconnect
            
            const port = new URLSearchParams(window.location.search).get('wsport') || 8765;
            websocket = new WebSocket(`ws://localhost:${port}`);
            
            websocket.onopen = () => {
                statusIndicator.style.backgroundColor = 'green';
                isConnected = true;
                reconnectAttempt = 0; // Reset reconnect attempt counter on successful connection
            };
            
            websocket.onmessage = (event) => {
                messageHandler.processMessage(event.data);
            };
            
            websocket.onclose = () => {
                statusIndicator.style.backgroundColor = 'red';
                isConnected = false;
                
                // Implement exponential backoff for reconnection
                const delay = Math.min(1000 * Math.pow(1.5, reconnectAttempt), maxReconnectDelay);
                reconnectAttempt++;
                
                console.log(`WebSocket disconnected. Reconnecting in ${delay}ms...`);
                reconnectTimeout = setTimeout(connectWebSocket, delay);
            };
            
            websocket.onerror = (error) => {
                statusIndicator.style.backgroundColor = 'red';
                // Error handling is done in onclose
            };
        }

        // Set up UI controls
        function setupUI() {
            const controlsContainer = document.createElement('div');
            controlsContainer.style.position = 'absolute';
            controlsContainer.style.bottom = '10px';
            controlsContainer.style.left = '10px';
            controlsContainer.style.background = 'rgba(255, 255, 255, 0.8)';
            controlsContainer.style.padding = '10px';
            controlsContainer.style.borderRadius = '5px';
            document.body.appendChild(controlsContainer);

            const displayModeButton = document.createElement('button');
            // Set initial text based on CharacterManager's current mode
            updateDisplayButtonText(displayModeButton);
            
            displayModeButton.onclick = () => {
                const newMode = characterManager.cycleDisplayMode();
                updateDisplayButtonText(displayModeButton, newMode);
            };
            controlsContainer.appendChild(displayModeButton);

            // Add tensor visualizer toggle
            const tensorToggle = document.createElement('button');
            tensorToggle.innerText = 'Show Tensor';
            tensorToggle.style.marginLeft = '5px';
            tensorToggle.onclick = () => {
                const isVisible = tensorVisualizer.toggleVisibility();
                tensorToggle.innerText = isVisible ? 'Hide Tensor' : 'Show Tensor';
            };
            controlsContainer.appendChild(tensorToggle);
            
            // Add clear tensors button
            const clearTensorsButton = document.createElement('button');
            clearTensorsButton.innerText = 'Clear Tensors';
            clearTensorsButton.style.marginLeft = '5px';
            clearTensorsButton.onclick = () => {
                tensorVisualizer.clearTensors();
            };
            controlsContainer.appendChild(clearTensorsButton);

            // Add debug positions toggle
            const debugPositionsToggle = document.createElement('button');
            debugPositionsToggle.innerText = 'Show Debug Points';
            debugPositionsToggle.style.marginLeft = '5px';
            debugPositionsToggle.onclick = () => {
                const isVisible = debugVisualizer.toggleVisibility();
                debugPositionsToggle.innerText = isVisible ? 'Hide Debug Points' : 'Show Debug Points';
            };
            controlsContainer.appendChild(debugPositionsToggle);

            audioManager.addMuteButtonToUI(controlsContainer);

            // Connection status indicator
            statusIndicator = document.createElement('div');
            statusIndicator.style.width = '10px';
            statusIndicator.style.height = '10px';
            statusIndicator.style.borderRadius = '50%';
            statusIndicator.style.backgroundColor = 'red';
            statusIndicator.style.display = 'inline-block';
            statusIndicator.style.marginLeft = '10px';
            controlsContainer.appendChild(statusIndicator);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function updateDisplayButtonText(button) {
            const mode = characterManager.getCurrentDisplayMode();
            
            switch(mode) {
                case CharacterManager.DISPLAY_MODE.MESH_ONLY:
                    button.innerText = 'Display: Mesh Only';
                    break;
                case CharacterManager.DISPLAY_MODE.BOTH:
                    button.innerText = 'Display: Mesh + Skeleton';
                    break;
                case CharacterManager.DISPLAY_MODE.SKELETON_ONLY:
                    button.innerText = 'Display: Skeleton Only';
                    break;
            }
        }

        // Start the application
        init();
    </script>
</body>
</html>
